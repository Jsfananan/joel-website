<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>The Leader’s AI Skills Course · Leadership in Change</title>
<meta name="description" content="A guided course through the 25 skills in the Leadership in Change Skill Library for Leaders. Works in Claude, ChatGPT and Gemini.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/webp" href="/headshot.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;600;700&family=Inter:wght@400;500;600;700&family=Spectral:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script>document.documentElement.className = 'js';</script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<main class="soon" id="soon" hidden></main>
<div class="app" id="app">
  <header class="top">
    <button class="iconbtn menu" id="btn-menu" type="button" aria-label="Open the syllabus" aria-expanded="false" aria-controls="side">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <a class="brand" href="#home" aria-label="Leadership in Change, Course home"><img id="logo" alt="Leadership in Change" width="140" height="34"></a>
    <div class="cname">The Leader&rsquo;s AI Skills Course</div>
    <div class="topstats">
      <button class="topbtn" id="btn-skills" type="button" aria-haspopup="dialog"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16.5 16.5L21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>All 25 skills</span></button>
      <div class="xpchip" id="xpchip" aria-live="polite"></div>
      <span class="ring" id="ring-mini" title="Required parts done"><svg viewBox="0 0 44 44" aria-hidden="true"><circle class="track" cx="22" cy="22" r="18" stroke-width="4"/><circle class="fill" cx="22" cy="22" r="18" stroke-width="4"/></svg><b>0</b></span>
    </div>
    <div class="topline" aria-hidden="true"><i id="topline-fill"></i></div>
  </header>

  <aside class="side" id="side" aria-label="Course syllabus">
    <nav id="syllabus" aria-label="Syllabus"></nav>
    <div class="side-tools">
      <button class="linkbtn" id="btn-copy" type="button">Copy my answers</button>
      <button class="linkbtn" id="btn-reset" type="button">Start over</button>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main id="main" tabindex="-1"><div class="quest" id="quest" aria-label="Course map"></div><div class="screen" id="screen"></div></main>
  <aside class="rail" id="rail" aria-label="Your progress"></aside>
</div>

<div class="modal-back" id="modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" id="modal-box"></div>
</div>
<div class="sheet-back" id="sheet" hidden><aside class="sheet" id="sheet-box" role="dialog" aria-modal="true" aria-labelledby="sheet-title"></aside></div>
<div class="toast" id="toast" role="status"></div>
<canvas class="celebrate" id="celebrate" aria-hidden="true"></canvas>
<noscript><p style="padding:24px">This Course needs JavaScript to show your progress.</p></noscript>

<script src="logo.js"></script>
<script src="content.js"></script>
<script src="app.js"></script>
</body>
</html>
